<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>APX — Season Planner</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top-bar">
    <div class="brand">
      <span class="badge">APX</span>
      <h1>SEASON PLANNER</h1>
    </div>
    <div class="header-meta">
      <span id="range-label" class="range-label"></span>
      <span id="today-label" class="today-label"></span>
    </div>
  </header>

  <main class="container">
    <!-- 12-month rolling grid (previous month + next 11 months) -->
    <section id="calendar-grid" class="calendar-grid" aria-label="Rolling Annual Calendar"></section>

    <!-- Interactive Legend & Brush Tool (Option A) -->
    <section class="legend-panel">
      <div class="legend-header">
        <h2>COMPETITIONS & QUALIFIERS</h2>
        <div class="legend-actions">
          <button id="btn-export" class="btn btn-secondary" title="Export as JSON">Export</button>
          <label class="btn btn-secondary" title="Import JSON">
            Import
            <input type="file" id="input-import" accept=".json" hidden />
          </label>
        </div>
      </div>

      <!-- Quick add form -->
      <form id="event-form" class="event-form">
        <input type="text" id="event-name" placeholder="Name (e.g., Xenon Miami, MFC7...)" required />
        <select id="event-type" aria-label="Event Type">
          <option value="comp">Competition (Solid Fill)</option>
          <option value="qualif">Qualifier (Outline)</option>
          <option value="deadline">Deadline / Note (Dot)</option>
        </select>
        <input type="color" id="event-color" value="#613795" title="Color" />
        <button type="submit" class="btn btn-primary">+ Add</button>
      </form>

      <p class="hint">
        Click an event below to activate the brush, then click or drag across calendar days. Click a marked day again to clear it.
      </p>

      <!-- List of created events + date ranges -->
      <div id="legend-list" class="legend-list"></div>
    </section>
  </main>

  <script src="calendar.js"></script>
</body>
</html>
